<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メニューのご案内</title>
    <style>
        :root {
            --bg-color: #FAFAF8;
            --text-color: #2C2C2C;
            --sub-text: #767676;
            --accent-color: #1A1A1A;
            --border-color: #E5E5E0;
            --card-bg: #FFFFFF;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--sub-text);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .step {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
        }

        .step.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
        }

        .btn:hover {
            border-color: var(--accent-color);
            background-color: #Fcfcfc;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #FFFFFF;
            border-color: var(--accent-color);
            margin-top: 16px;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .sns-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .sns-btn {
            padding: 14px 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .sns-btn.selected {
            background-color: var(--accent-color);
            color: #FFFFFF;
            border-color: var(--accent-color);
        }

        .loading-text {
            font-size: 0.9rem;
            color: var(--sub-text);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- STEP 1: 来店回数の選択 -->
        <div id="step-1" class="step active">
            <h1>ご来店ありがとうございます</h1>
            <p class="subtitle">当店へのお越しは初めてですか？</p>
            <button class="btn" onclick="selectVisitType('初めて')">初めてのご来店</button>
            <button class="btn" onclick="selectVisitType('2回目以降')">2回目以降のご来店</button>
        </div>

        <!-- STEP 2-A: リピーター向け（自動遷移） -->
        <div id="step-returning" class="step">
            <h1>いつもありがとうございます</h1>
            <p class="subtitle loading-text">メニュー画面へご案内いたします...</p>
        </div>

        <!-- STEP 2-B: 初回向け（SNSアンケート） -->
        <div id="step-first" class="step">
            <h1>どちらでお知りになりましたか？</h1>
            <p class="subtitle">よろしければ教えてください（任意）</p>
            
            <div class="sns-grid">
                <button class="sns-btn" onclick="selectSns(this, 'Instagram')">Instagram</button>
                <button class="sns-btn" onclick="selectSns(this, 'X (Twitter)')">X (Twitter)</button>
                <button class="sns-btn" onclick="selectSns(this, 'TikTok')">TikTok</button>
                <button class="sns-btn" onclick="selectSns(this, 'Google検索')">Google検索</button>
                <button class="sns-btn" onclick="selectSns(this, '知人の紹介')">知人の紹介</button>
                <button class="sns-btn" onclick="selectSns(this, 'その他')">その他</button>
            </div>

            <button class="btn btn-primary" onclick="submitAndRedirect()">メニューを見る</button>
        </div>
    </div>

    <script>
        // 設定: AirレジメニューのURL
        const AIRREGI_URL = "[https://airregi.jp/menu/YOUR_SHOP_ID](https://airregi.jp/menu/YOUR_SHOP_ID)"; // ← 実際のAirレジURLに変更

        // 設定: Googleフォームの送信先エンドポイント（例）
        const GOOGLE_FORM_URL = "[https://docs.google.com/forms/u/0/d/e/1FAIpQLS.../formResponse](https://docs.google.com/forms/u/0/d/e/1FAIpQLS.../formResponse)";
        const ENTRY_VISIT_TYPE = "entry.523120851_sentinel"; // フォームの「来店回数」項目ID
        const ENTRY_SNS_SOURCE = "entry.1374582927_sentinel"; // フォームの「流入元」項目ID

        let selectedVisit = "";
        let selectedSnsSource = "";

        function switchStep(fromId, toId) {
            document.getElementById(fromId).classList.remove('active');
            setTimeout(() => {
                document.getElementById(toId).classList.add('active');
            }, 150);
        }

        function selectVisitType(type) {
            selectedVisit = type;
            if (type === '2回目以降') {
                switchStep('step-1', 'step-returning');
                sendDataToGoogleForm(type, "");
                // 1.5秒後にAirレジへ遷移
                setTimeout(() => {
                    window.location.href = AIRREGI_URL;
                }, 1500);
            } else {
                switchStep('step-1', 'step-first');
            }
        }

        function selectSns(element, source) {
            document.querySelectorAll('.sns-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            selectedSnsSource = source;
        }

        function selectSns(element, source) {
            document.querySelectorAll('.sns-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
            selectedSnsSource = source;
        }

        function submitAndRedirect() {
            // アンケートデータの送信（非同期）
            sendDataToGoogleForm(selectedVisit, selectedSnsSource);
            // 即座にAirレジへ遷移
            window.location.href = AIRREGI_URL;
        }

        function sendDataToGoogleForm(visitType, snsSource) {
            if (!GOOGLE_FORM_URL.includes("docs.google.com")) return; // 未設定時はスキップ

            const formData = new FormData();
            formData.append(ENTRY_VISIT_TYPE, visitType);
            if (snsSource) {
                formData.append(ENTRY_SNS_SOURCE, snsSource);
            }

            // CORS制約を回避するため no-cors モードで送信
            fetch(GOOGLE_FORM_URL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            }).catch(error => {
                console.log("Analytics transmission completed.");
            });
        }
    </script>
</body>
</html>
